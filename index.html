<!doctype html>
<html lang="es" class="bg-slate-50 dark:bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=3" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('control_gastos_theme') || 'system';
          var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#090E1A');
            var apple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
            if (apple) apple.setAttribute('content', 'black-translucent');
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <title>Control Gastos</title>
    <meta name="description" content="Aplicación de control de gastos personales y gestión presupuestaria conectada a Google Sheets." />
    <meta property="og:title" content="Control Gastos" />
    <meta property="og:description" content="Aplicación de control de gastos personales y gestión presupuestaria conectada a Google Sheets." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 min-h-screen text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
